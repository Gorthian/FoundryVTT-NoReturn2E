name: Claude Code Auto-Fix

on:
  pull_request_review:
    types: [submitted]

jobs:
  fix-review-comments:
    if: >
      github.event.review.state == 'changes_requested' &&
      contains(github.event.review.body, 'Antigravity Review')
    runs-on: self-hosted
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.CUSTOM_PAT }}

      - name: Guardrail - Max 3 Auto-Fix Runden prüfen
        shell: pwsh
        run: |
          $botCommits = (git log --author="Claude Code Bot" --oneline | Measure-Object).Count
          if ($botCommits -ge 3) {
            Write-Error "Maximale Anzahl von 3 Auto-Fix-Iterationen erreicht. Bitte manuell prüfen."
            exit 1
          }

      - name: Execute Claude Code on Feedback
        shell: pwsh
        run: |
          $feedback = @"
          ${{ github.event.review.body }}
          "@
          claude -p --max-turns 10 "Analysiere das folgende Code-Review für dieses FoundryVTT-Modul und setze alle geforderten Änderungen im Code um. Committe die Änderungen nicht selbst: $feedback"

      - name: Commit and Push Changes
        shell: pwsh
        run: |
          git config user.name "Claude Code Bot"
          git config user.email "claude-bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "fix: address Antigravity review comments"
            git push
          }
